# Levanta el FILE-SERVER vulnerable. En el equipo que hace de nodo:
#   docker compose up -d --build
# Reset entre visitantes:  ./reset.sh  (recrea el contenedor, estado limpio)
services:
  fileserver:
    build: .
    image: netlab-fileserver
    container_name: netlab-fileserver
    ports:
      - "80:80"       # web vulnerable
      - "2222:22"     # SSH del nodo en el host:2222 (evita chocar con el sshd propio del equipo).
                      # La app lo usa con [fileserver].ssh_port = 2222 en config.toml.
    environment:
      LAB_USER: admin
      LAB_PASS: S3cr3t-2024!
      LAB_BASE: /srv/lab
    restart: unless-stopped
    # Salud del nodo: 'docker ps' / 'fileserver.sh status' marcan (un)healthy si la
    # web se cae. Usa python (curl no esta en la imagen python:slim).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
